name: tmc-aacs

services:
  postgres:
    image: postgres:17-alpine
    container_name: tmc-postgres
    environment:
      POSTGRES_DB: tmc_central
      POSTGRES_USER: tmc
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tmc_dev_password}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - tmc-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmc -d tmc_central"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:5
    container_name: tmc-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: tmc-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  central-api:
    build:
      context: ../backend
      dockerfile: Dockerfile.central
    container_name: tmc-central-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tmc_central
      DB_USER: ${DB_USER:-tmc}
      DB_PASSWORD: ${DB_PASSWORD:-tmc_dev_password}
      SERVER_PORT: 8080
      APP_ENV: ${APP_ENV:-local}
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  edge-agent:
    build:
      context: ../backend
      dockerfile: Dockerfile.edge
    container_name: tmc-edge-agent
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${EDGE_SERVER_PORT:-8081}:8081"
    environment:
      EDGE_DB_URL: jdbc:postgresql://postgres:5432/tmc_edge
      DB_USER: ${DB_USER:-tmc}
      DB_PASSWORD: ${DB_PASSWORD:-tmc_dev_password}
      EDGE_SERVER_PORT: 8081
      APP_ENV: ${APP_ENV:-local}
      FACTORY_ID: ${FACTORY_ID:-TMC-BD}

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: tmc-frontend
    depends_on:
      central-api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  tmc-postgres-data:
