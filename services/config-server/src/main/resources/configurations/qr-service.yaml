# ==============================================================================
# QR SERVICE - QR DONG VA CREDENTIAL
# Phan phoi boi Config Server; gia tri moi truong nam trong .env rieng cua service.
# ==============================================================================

# 1. Application port
server:
  port: ${QR_SERVICE_PORT:8082}

spring:
  # 2. PostgreSQL - host, port, database, user va password tu .env
  datasource:
    url: ${QR_DB_URL:jdbc:postgresql://${QR_DB_HOST:localhost}:${QR_DB_PORT:5432}/${QR_DB_NAME:qr_db}}
    driver-class-name: org.postgresql.Driver
    username: ${QR_DB_USER:${QR_DB_USERNAME:qr_app}}
    password: ${QR_DB_PASSWORD:local-db-password}

tmc:
  events:
    enabled: ${EVENTS_ENABLED:false}
  qr:
    ttl: ${QR_TTL:60s}
    issuer: ${QR_ISSUER:tmc-qr}
    jwk-set-file: ${QR_JWK_SET_FILE:file:./.local/qr-jwks.json}
  internal:
    enabled: ${INTERNAL_APIS_ENABLED:false}
    token-uri: ${IDENTITY_TOKEN_URI:http://localhost:8081/oauth2/token}
    identity-url: ${IDENTITY_API_URL:http://localhost:8081}
    client-id: ${INTERNAL_CLIENT_ID:}
    client-secret: ${INTERNAL_CLIENT_SECRET:}
    scopes: identity.verify
